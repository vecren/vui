[package]
name = "vui-host"
version.workspace = true
license.workspace = true

[lib]
name = "vui-host"
module = "vui.host"
archive = "vui-host"
sources = ["src/lib.cppm", "src/frames.cppm", "src/runner.cppm", "src/window.cppm", "src/window.cpp", "src/ffi/wayland.cppm", "src/ffi/xdg_shell.cppm", "src/ffi/x11.cppm", "src/ffi/xkb.cppm", "src/ffi/vulkan.cppm", "src/platform/wayland.cppm", "src/platform/wayland_window.cppm", "src/platform/x11.cppm", "src/platform/x11_window.cppm"]

[dependencies]
vui-render = { workspace = true, pub = true }
rstd-nostd = { workspace = true, usage = "link" }

[external-dependencies.pkg-config]
wayland-client = { module = "wayland-client" }
x11 = { module = "x11" }
xkbcommon = { module = "xkbcommon" }
vulkan = { module = "vulkan" }

[build-tools.wayland-scanner]
path = "wayland-scanner"
