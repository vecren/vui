[package]
name = "vui-host"
version.workspace = true
license.workspace = true
target = { os = ["linux", "windows", "macos"] }

[lib]
name = "vui-host"
module = "vui.host"
archive = "vui-host"
when = [{ condition = 'target.os == "macos"', source-groups = ["macos"] }]

[source-groups.macos]
sources = ["src/platform/macos/window.mm"]

[[when]]
condition = 'target.os == "windows"'
[when.usage]
system-libraries = ["user32", "gdi32", "imm32"]

[dependencies]
rstd-dlopn = { version = "0.1.11", condition = 'target.os == "linux"' }
vvk = { version = "0.1.2", pub = true }
vui-render = { workspace = true, pub = true }

[external-dependencies.pkg-config]
wayland-client = { module = "wayland-client", usage = "compile", condition = 'target.os == "linux"' }
x11 = { module = "x11", usage = "compile", condition = 'target.os == "linux"' }
xcb = { module = "xcb", usage = "compile", condition = 'target.os == "linux"' }
xcb-randr = { module = "xcb-randr", usage = "compile", condition = 'target.os == "linux"' }
xkbcommon = { module = "xkbcommon", usage = "compile", condition = 'target.os == "linux"' }

[build-tools.wayland-scanner]
path = "wayland-scanner"
condition = 'target.os == "linux"'
