[package]
name = "vui-sdl"
version.workspace = true
license.workspace = true

[lib]
name = "vui-sdl"
module = "vui.sdl"
archive = "vui-sdl"
sources = ["src/lib.cppm", "src/frames.cppm", "src/window.cppm", "src/window.cpp"]

[dependencies]
vui-render = { workspace = true, pub = true }
rstd-nostd = { workspace = true, usage = "link" }

[external-dependencies.pkg-config]
sdl2 = { module = "sdl2", version = ">= 2.0.18", pub = true }
