[workspace]
name = "vui-examples"
members = ["common", "gallery", "2048", "interaction"]

[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"

[profile.base]
exceptions = false
rtti = false

[workspace.dependencies]
rstd-std = { version = "0.1.5" }
vui-examples = { path = "common" }
vui-host = { path = "../host" }
vui-controls = { path = "../controls" }
vui-compose = { path = "../compose" }
vectext = { path = "../../vectext" }
rstd-nostd = { version = "0.1.5" }
