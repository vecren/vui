[package]
name = "vui-examples"
version.workspace = true
license.workspace = true

[lib]
name = "vui-examples"
module = "vui.examples"
archive = "vui-examples"
path = "lib.cppm"
source-root = "."

[usage]
options = ["-Wall", "-Wextra", "-Wno-missing-field-initializers", "-Werror=return-type"]

[dependencies]
rstd-std = { workspace = true, pub = true }
vui-controls = { workspace = true, pub = true }
vui-host = { workspace = true, pub = true }
vectext = { workspace = true, pub = true }
rstd-nostd = { workspace = true, usage = "link" }
