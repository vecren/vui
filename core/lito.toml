[package]
name = "vui"
version.workspace = true
license.workspace = true

[lib]
name = "vui"
module = "vui"
archive = "vui"
sources = [
    "src/animation.cppm",
    "src/binding/scope.cppm",
    "src/binding/signal.cppm",
    "src/composition.cppm",
    "src/content.cppm",
    "src/diagnostics.cppm",
    "src/display_list.cppm",
    "src/document.cppm",
    "src/endpoint.cppm",
    "src/frame.cppm",
    "src/image.cppm",
    "src/input/hit_test.cppm",
    "src/input/protocol.cppm",
    "src/input/router.cppm",
    "src/interaction/arena.cppm",
    "src/interaction/navigation.cppm",
    "src/interaction/velocity.cppm",
    "src/layout.cppm",
    "src/layout/parameters.cppm",
    "src/layout/protocol.cppm",
    "src/lib.cppm",
    "src/motion/drivers.cppm",
    "src/motion/dynamics.cppm",
    "src/motion/properties.cppm",
    "src/node/types.cppm",
    "src/paint/protocol.cppm",
    "src/session.cppm",
    "src/text.cppm",
    "src/types.cppm",
    "src/visual.cppm",
    "src/wakeup.cppm",
]


[dependencies]
vectext = { path = "../../vectext", pub = true }
rstd-std = { workspace = true, pub = true }
rstd-nostd = { workspace = true, usage = "link" }
