[workspace]
name = "vui"
members = ["core", "controls", "host", "render", "image", "compose"]

[workspace.package]
version = "0.1.0"
authors = ["hypengw <hypengwip@gmail.com>"]
license = "MIT OR Apache-2.0"

[profile.base]
exceptions = false
rtti = false

[workspace.dependencies]
ligraph = { version = "0.1.0" }
vui = { path = "core" }
vui-render = { path = "render" }
vui-controls = { path = "controls" }
vui-host = { path = "host" }
vui-image = { path = "image" }
vui-compose = { path = "compose" }
vrento = { version = "0.1.0" }
vectext = { version = "0.1.0" }
rstd-std = { version = "0.1.5" }
rstd-nostd = { version = "0.1.5" }
