[workspace]
name = "vui"
members = ["core", "host", "render", "image", "plugin"]

[workspace.package]
version = "0.1.0"
authors = ["hypengw <hypengwip@gmail.com>"]
license = "MIT OR Apache-2.0"

[profile.base]
exceptions = false
rtti = false

[workspace.dependencies]
vui = { path = "core" }
vui-render = { path = "render" }
vui-host = { path = "host" }
vui-image = { path = "image" }
rstd-std = { version = "0.1.5" }
ligraph = { version = "0.1.0" }
vrento = { git = "https://github.com/vecren/vrento.git" }
vectext = { git = "https://github.com/vecren/vectext.git" }
